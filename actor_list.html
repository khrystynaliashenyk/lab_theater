<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>List Of Actors</title>
</head>
<body>
<h1>List of Actors</h1>
<ul>
    {% for actor in actors %}
        <li>
            <a href="{% url 'actor_detail' actor.pk %}">{{ actor.first_name }} {{ actor.last_name }}</a>
            <form method="get" action="{% url 'actor_delete' actor.pk %}" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </li>
    {% endfor %}
</ul>
<a href="{% url 'actor_create' %}">Add a new actor</a>
</body>
</html>
